  raw_path: white_background
  params:
    max_size: [1024, 1024]
    shrink_mode: scale
    size_multiple: 16
evaluator:
  path: white-background.py
  params: {}
aggregator:
  path: white_background.py
  params: {}
model:
  backend: dummy
  id: white-background-dummy-v1
trials: 1
base_seed: 42
concurrency: 3
retries:
  max_attempts: 3
  base_delay_s: 1
  max_delay_s: 30
save_inputs: true
s3:
  enabled: false
