# PILOT (uniform subset) — numbers are NOT full-test-set results; report them as a subset.
# Surface normal estimation — CALIBRATION run for the RGB->GT axis convention (DIODE outdoor, disjoint from all test sets)
# Data: scripts/download_surface_normal.sh.  Run:  uv run visionbench run --config qwen_normal_calib_pilot
task_name: surface_normal_calib
generation_version: qwen-pilot-v1
output_root: ../outputs
system_prompt: |
  Edit the input image according to the instruction. Return one image.
dataset:
  path: surface_normal_diode.py
  raw_path: surface_normal/diode/val  # scripts/download_surface_normal.sh
  params:
    max_size: [1024, 1024]   # NYUv2/iBims 640x480 and DIODE 1024x768 pass through unchanged
    shrink_mode: scale
    size_multiple: 32        # Qwen-Image 2.1 requires dimensions divisible by 32.
    subset: outdoor          # calibration only: DIODE OUTDOOR, never used as test data
    sample_stride: 22        # PILOT: ~20 calibration images
evaluator:
  path: surface_normal.py
  params:
    # Fixed RGB-channel -> GT-axis mapping. Set ONCE from the calibration run
    # (qwen_normal_calib + `python tasks/evaluators/surface_normal.py calibrate`),
    # then keep it identical for nyuv2 / ibims / diode.
    rgb_to_gt: ["+r", "+g", "+b"]
    degenerate_norm_eps: 0.05   # decoded |v| below this = no direction (e.g. mid-gray)
    degenerate_error_deg: 90.0  # error assigned to degenerate / uncovered valid pixels
aggregator:
  path: surface_normal.py
  params:
    failed_sample_policy: penalize  # images whose generation failed count as 90 deg everywhere
    degenerate_error_deg: 90.0
model:
  backend: qwen
  id: Qwen/Qwen-Image-2.1
  revision: 790c92633540aa0cb11d9abf19eb46d861714758
  cache_dir: ../model-cache
  profile: vram_16gb
  options:
    num_inference_steps: 40
    vae_precision: bf16
trials: 1
base_seed: 42
concurrency: 3 # Remote only. Local Qwen always uses one worker.
retries:
  max_attempts: 3
  base_delay_s: 1
  max_delay_s: 30
save_inputs: true
s3:
  enabled: false
